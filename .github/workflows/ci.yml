name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # .npmrc cannot carry this: modern npm treats an unknown key there as an npm
  # config and never passes it to package install scripts, so every install
  # downloads ~150MB of Chromium. Railway gets the same variable from
  # nixpacks.toml; CI gets it here.
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # Cheap and independent, so each step reports on its own rather than
      # hiding behind the first failure.
      - name: Typecheck
        run: npx tsc --noEmit
        continue-on-error: true   # advisory until Phase 3 converts real modules

      - name: Lint
        run: npx eslint . --max-warnings=0
        continue-on-error: true   # advisory until the existing violations clear

      - name: Architecture boundaries
        run: npm run lint:deps

      # The guard that matters most: the web and Expo clients are fixed, so the
      # API surface must not move. Fails on any route added, removed or renamed.
      - name: Route parity
        run: npm run routes:check

      - name: Tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
